name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: phantom-macos-arm64
            pyinstaller_name: phantom
          - os: ubuntu-latest
            artifact: phantom-linux-x86_64
            pyinstaller_name: phantom
          - os: windows-latest
            artifact: phantom-windows.exe
            pyinstaller_name: phantom.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller build/phantom.spec --distpath dist/ --workpath build/tmp --clean

      - name: Rename artifact
        shell: bash
        env:
          PYINSTALLER_NAME: ${{ matrix.pyinstaller_name }}
          ARTIFACT: ${{ matrix.artifact }}
        run: mv "dist/$PYINSTALLER_NAME" "dist/$ARTIFACT" || true

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller build/phantom.spec --distpath dist/ --workpath build/tmp --clean

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          mkdir -p staging/usr/bin
          mkdir -p staging/usr/share/applications
          cp dist/phantom staging/usr/bin/phantom
          cp packaging/linux/phantom.desktop staging/usr/share/applications/

          for size in 16 32 48 64 128 256 512; do
            mkdir -p staging/usr/share/icons/hicolor/${size}x${size}/apps
            cp assets/icon-${size}.png staging/usr/share/icons/hicolor/${size}x${size}/apps/phantom.png
          done

          fpm -s dir -t deb -n phantom -v "$VERSION" \
            --description "Cross-platform activity simulator" \
            --license MIT --architecture amd64 \
            --maintainer "Phantom Contributors" \
            --url "https://github.com/hammadxcm/go-phantom" \
            --category utils \
            --after-install packaging/linux/postinst.sh \
            -C staging .

      - name: Upload .deb artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: phantom-deb
          path: '*.deb'

  # ─── Native macOS App (.dmg) ──────────────────────────────────────────────
  build-macos-native:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="Phantom-${VERSION}-beta.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build universal binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild -project phantom-macos/Phantom.xcodeproj \
            -scheme Phantom \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            build

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find build -name "Phantom.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          create-dmg \
            --volname "Phantom" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Phantom.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "$DMG_NAME" \
            "$APP_PATH" || true
          ls -la "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Phantom-macOS-native
          path: ${{ steps.version.outputs.dmg_name }}

  release:
    needs: [build, build-deb, build-macos-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/phantom-macos-arm64/phantom-macos-arm64
            artifacts/phantom-linux-x86_64/phantom-linux-x86_64
            artifacts/phantom-windows.exe/phantom-windows.exe
            artifacts/phantom-deb/*.deb
            artifacts/Phantom-macOS-native/Phantom-*-beta.dmg

  # ─── Snap Store (Linux) ──────────────────────────────────────────────────────
  publish-snap:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download Linux binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: phantom-linux-x86_64
          path: .

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snap-build

      - name: Publish to Snap Store
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
        with:
          snap: ${{ steps.snap-build.outputs.snap }}
          release: stable

  # ─── Chocolatey (Windows) ────────────────────────────────────────────────────
  publish-choco:
    needs: [release]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download Windows binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: phantom-windows.exe
          path: .

      - name: Compute SHA256 and update install script
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path phantom-windows.exe -Algorithm SHA256).Hash
          $version = $env:GITHUB_REF_NAME.TrimStart("v")

          # Update nuspec version
          $nuspec = Get-Content packaging/chocolatey/go-phantom.nuspec -Raw
          $nuspec = $nuspec -replace '<version>[^<]+</version>', "<version>$version</version>"
          Set-Content packaging/chocolatey/go-phantom.nuspec $nuspec

          # Update install script checksum
          $install = Get-Content packaging/chocolatey/tools/chocolateyInstall.ps1 -Raw
          $install = $install -replace "checksum\s*=\s*'[^']*'", "checksum      = '$hash'"
          Set-Content packaging/chocolatey/tools/chocolateyInstall.ps1 $install

      - name: Pack and push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          cd packaging/chocolatey
          choco pack go-phantom.nuspec
          choco push (Get-ChildItem *.nupkg).Name --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  # ─── WinGet (Windows) ───────────────────────────────────────────────────────
  # NOTE: winget-releaser requires the package to already exist in the
  # winget-pkgs repository.  For the initial submission, open a PR manually
  # at https://github.com/microsoft/winget-pkgs.  Subsequent releases will
  # be auto-updated by this job.
  publish-winget:
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: hammadxcm.go-phantom
          installers-regex: phantom-windows\.exe$
          token: ${{ secrets.WINGET_TOKEN }}

  # ─── Scoop Bucket (Windows) ─────────────────────────────────────────────────
  publish-scoop:
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download Windows binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: phantom-windows.exe
          path: .

      - name: Update Scoop manifest and push to bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag names reach Ruby/JSON source below, so reject anything that is
          # not a plain semver before it is interpolated (CWE-94).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish from unexpected tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          HASH=$(sha256sum phantom-windows.exe | cut -d' ' -f1)

          # Clone the bucket repo
          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/hammadxcm/scoop-phantom.git" bucket-repo
          mkdir -p bucket-repo/bucket

          # Generate updated manifest
          cat > bucket-repo/bucket/go-phantom.json << EOF
          {
              "version": "${VERSION}",
              "description": "Cross-platform activity simulator",
              "homepage": "https://github.com/hammadxcm/go-phantom",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/hammadxcm/go-phantom/releases/download/v${VERSION}/phantom-windows.exe",
                      "hash": "${HASH}"
                  }
              },
              "bin": [["phantom-windows.exe", "phantom"]],
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/hammadxcm/go-phantom/releases/download/v\$version/phantom-windows.exe"
                      }
                  }
              }
          }
          EOF

          # Commit and push
          cd bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/go-phantom.json
          git commit -m "Update go-phantom to v${VERSION}" || echo "No changes"
          git push

  # ─── Homebrew Tap (macOS/Linux) ─────────────────────────────────────────────
  publish-homebrew:
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@v7
        with:
          name: phantom-macos-arm64
          path: .

      - name: Download Linux binary
        uses: actions/download-artifact@v7
        with:
          name: phantom-linux-x86_64
          path: .

      - name: Update formula and push to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag names reach Ruby/JSON source below, so reject anything that is
          # not a plain semver before it is interpolated (CWE-94).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish from unexpected tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          MAC_SHA=$(sha256sum phantom-macos-arm64 | cut -d' ' -f1)
          LINUX_SHA=$(sha256sum phantom-linux-x86_64 | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/hammadxcm/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula

          cat > tap-repo/Formula/phantom.rb << FORMULA
          class Phantom < Formula
            desc "Cross-platform activity simulator"
            homepage "https://github.com/hammadxcm/go-phantom"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/hammadxcm/go-phantom/releases/download/v${VERSION}/phantom-macos-arm64"
                sha256 "${MAC_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/hammadxcm/go-phantom/releases/download/v${VERSION}/phantom-linux-x86_64"
                sha256 "${LINUX_SHA}"
              end
            end

            def install
              bin.install Dir["phantom-*"].first => "phantom"
            end

            test do
              assert_match "phantom", shell_output("#{bin}/phantom --help")
            end
          end
          FORMULA

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/phantom.rb
          git commit -m "Update phantom to v${VERSION}" || echo "No changes"
          git push
